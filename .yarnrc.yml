# Version de Yarn embarquée dans le dépôt : fonctionne même sans Corepack
# (Node 26 ne l'inclut plus), en local comme sur Vercel.
yarnPath: .yarn/releases/yarn-4.5.1.cjs

# node_modules classique (Prisma et Next ne gèrent pas bien Plug'n'Play).
nodeLinker: node-modules

# Garde le même format de cache que le yarn.lock existant.
compressionLevel: mixed

enableTelemetry: false
